[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stripe-mcp"
version = "0.1.0"
description = "Read-only Stripe MCP server — balance, customers, payment intents, invoices, products, prices."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Seaynic Labs", email = "hello@seayniclabs.com" },
]
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "stripe",
    "payments",
    "ai",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.13.4,<4",
    "fastmcp>=3.1.0",
    "future>=0.18.3",
    "stripe>=11.0.0",
]

[project.urls]
Homepage = "https://github.com/seayniclabs/stripe-mcp"
Repository = "https://github.com/seayniclabs/stripe-mcp"
Issues = "https://github.com/seayniclabs/stripe-mcp/issues"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pip-audit",
]

[project.scripts]
stripe-mcp = "stripe_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stripe_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
